<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">The Feature Factory loop</title>
  <desc id="desc">A feature moves through Discover, Plan, Build, Verify, Approve and Success. Gates written in code judge every stage. A human approves the story, the technical brief and the validated change; each approval is bound to a SHA-256 hash of what was shown. Failed builder attempts retry up to three times, a critical validator finding returns to the owning builder for up to two rounds, and a rejection sends the work back to the agent that produced it. Any stop can be resumed. Every run leaves a record that feeds the next one.</desc>
  <style>
    .bg { fill: #faf9f6; }
    .ink { stroke: #1f2328; }
    .ink-fill { fill: #1f2328; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .human { fill: #fff8ec; stroke: #b45309; stroke-width: 2; }
    .note { fill: none; stroke: #1f2328; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #1f2328; stroke-width: 1.5; }
    .loop { fill: none; stroke: #1f2328; stroke-width: 1.3; stroke-dasharray: 6 5; }
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .muted { fill: #57606a; }
    .accent { fill: #b45309; }
    .h1 { font-size: 30px; letter-spacing: 5px; font-weight: 300; }
    .sub { font-size: 12px; letter-spacing: 2.6px; }
    .kicker { font-size: 11px; letter-spacing: 2px; }
    .name { font-size: 19px; letter-spacing: 1.5px; font-weight: 500; }
    .small { font-size: 11.5px; }
    .tiny { font-size: 10.5px; }
    .bar-title { font-size: 13px; letter-spacing: 2.4px; }
    .bar-line { font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { stroke: #e6edf3; }
      .ink-fill { fill: #e6edf3; }
      .box { fill: #161b22; stroke: #e6edf3; }
      .human { fill: #2a1f0f; stroke: #f0b35a; }
      .note, .flow, .loop { stroke: #e6edf3; }
      .t { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .accent { fill: #f0b35a; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ink-fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <!-- Title -->
  <text class="t h1" x="600" y="50" text-anchor="middle">THE FEATURE FACTORY LOOP</text>
  <text class="t sub muted" x="600" y="78" text-anchor="middle">GATES ARE CODE · A HUMAN APPROVES THE STORY, THE BRIEF AND THE CHANGE · EVERY RUN LEAVES A RECORD</text>

  <!-- Reject loops (above the row) -->
  <path class="loop" d="M352,170 V126 H272 V168" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="312" y="116" text-anchor="middle">reject + notes → story / brief reworked</text>
  <path class="loop" d="M848,170 V126 H544 V168" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="696" y="116" text-anchor="middle">rejected at CHECKPOINT 3 → builders rework with your notes</text>

  <!-- Main row -->
  <!-- 01 DISCOVER -->
  <rect class="box" x="40" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="120" y="196" text-anchor="middle">01 / DISCOVER</text>
  <text class="t name" x="120" y="236" text-anchor="middle">RESEARCH</text>
  <text class="t small" x="120" y="270" text-anchor="middle">01 Researcher</text>
  <text class="t small muted" x="120" y="290" text-anchor="middle">maps the real codebase</text>
  <text class="t small muted" x="120" y="318" text-anchor="middle">→ Stage 1 gate</text>

  <!-- 02 PLAN -->
  <rect class="human" x="232" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="312" y="196" text-anchor="middle">02 / PLAN</text>
  <text class="t name" x="312" y="236" text-anchor="middle">DEFINE</text>
  <text class="t small" x="312" y="266" text-anchor="middle">02 Story → story gate</text>
  <text class="t small accent" x="312" y="284" text-anchor="middle">CHECKPOINT 1</text>
  <text class="t small" x="312" y="306" text-anchor="middle">03 Brief → spec gate</text>
  <text class="t small accent" x="312" y="324" text-anchor="middle">CHECKPOINT 2</text>

  <!-- 03 BUILD -->
  <rect class="box" x="424" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="504" y="196" text-anchor="middle">03 / EXECUTE</text>
  <text class="t name" x="504" y="236" text-anchor="middle">BUILD</text>
  <text class="t small" x="504" y="270" text-anchor="middle">04 Backend · 05 Frontend</text>
  <text class="t small muted" x="504" y="290" text-anchor="middle">only the tools they need</text>
  <text class="t small muted" x="504" y="318" text-anchor="middle">→ Gate 1 · Stage 3 gate</text>

  <!-- 04 VERIFY -->
  <rect class="box" x="616" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="696" y="196" text-anchor="middle">04 / VERIFY</text>
  <text class="t name" x="696" y="236" text-anchor="middle">PROVE</text>
  <text class="t small" x="696" y="270" text-anchor="middle">Gate 1.5 · 06 Tests</text>
  <text class="t small" x="696" y="290" text-anchor="middle">Gate 2 · 07 Validator</text>
  <text class="t small muted" x="696" y="318" text-anchor="middle">→ Stage 4 gate</text>

  <!-- 05 APPROVE -->
  <rect class="human" x="808" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="888" y="196" text-anchor="middle">05 / APPROVE</text>
  <text class="t name" x="888" y="236" text-anchor="middle">DECIDE</text>
  <text class="t small accent" x="888" y="266" text-anchor="middle">CHECKPOINT 3</text>
  <text class="t small" x="888" y="290" text-anchor="middle">report + findings + diff</text>
  <text class="t small muted" x="888" y="318" text-anchor="middle">approval bound to sha256</text>

  <!-- 06 SUCCESS -->
  <rect class="box" x="1000" y="170" width="160" height="170" rx="10"/>
  <text class="t kicker muted" x="1080" y="196" text-anchor="middle">06 / ACCEPT</text>
  <text class="t name" x="1080" y="236" text-anchor="middle">SUCCESS</text>
  <text class="t small" x="1080" y="270" text-anchor="middle">baseline.json written</text>
  <text class="t small muted" x="1080" y="290" text-anchor="middle">the test bar only rises</text>
  <text class="t small muted" x="1080" y="318" text-anchor="middle">exit 0</text>

  <!-- Forward arrows -->
  <path class="flow" d="M200,255 H230" marker-end="url(#arrow)"/>
  <path class="flow" d="M392,255 H422" marker-end="url(#arrow)"/>
  <path class="flow" d="M584,255 H614" marker-end="url(#arrow)"/>
  <path class="flow" d="M776,255 H806" marker-end="url(#arrow)"/>
  <path class="flow" d="M968,255 H998" marker-end="url(#arrow)"/>

  <!-- Failure loops (below the row) -->
  <!-- A: builder retries itself -->
  <path class="loop" d="M574,340 V375 H494 V342" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="548" y="393" text-anchor="middle">fail → retry ≤3, told the exact gap</text>
  <!-- B: validator CRITICAL back to owning builder -->
  <path class="loop" d="M656,340 V450 H450 V342" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="553" y="468" text-anchor="middle">CRITICAL on a builder's file → owning builder, ≤2 rounds</text>
  <!-- C: pause at a checkpoint -->
  <path class="loop" d="M930,340 V380 H850 V342" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="890" y="398" text-anchor="middle">pause → exit 3 → --approve / --reject</text>

  <!-- Resume callout -->
  <rect class="note" x="110" y="368" width="300" height="74" rx="8"/>
  <text class="t small" x="260" y="392" text-anchor="middle">Any stop — escalate (exit 1), pause, crash —</text>
  <text class="t small" x="260" y="410" text-anchor="middle">continues with --resume: finished work is skipped,</text>
  <text class="t small" x="260" y="428" text-anchor="middle">every gate is checked again, attempts carry over.</text>

  <!-- Record bar and its two connections -->
  <path class="flow" d="M1080,340 V518" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="1090" y="440">records</text>
  <path class="flow" d="M80,520 V342" marker-end="url(#arrow)"/>
  <text class="t tiny muted" x="90" y="490">lessons</text>

  <rect class="box" x="40" y="520" width="1120" height="128" rx="10"/>
  <text class="t bar-title muted" x="600" y="550" text-anchor="middle">EVERY RUN LEAVES A RECORD · THE NEXT RUN STARTS FROM IT</text>
  <text class="t bar-line" x="600" y="584" text-anchor="middle">state.json (steps · timings · hash-bound approvals) · _archive/ · baseline.json · --consolidate → PATTERNS.md</text>
  <text class="t bar-line" x="600" y="614" text-anchor="middle">A lesson becomes a test, a gate or a contract change — the code is the source of truth.</text>
  <text class="t small muted" x="600" y="636" text-anchor="middle">Phase A itself came from this loop: audit the records, change the code, test the change.</text>

  <!-- How the seven harness jobs map onto the factory -->
  <text class="t kicker muted" x="600" y="690" text-anchor="middle">CONTRACT: story + brief · CONTEXT: upstream file paths · TOOLS: per-agent grants · STATE: state.json</text>
  <text class="t kicker muted" x="600" y="712" text-anchor="middle">SENSORS: gates that read disk, not opinions · POLICY: checkpoints + attempt bounds · TRACES: timings + reports</text>
  <text class="t tiny muted" x="600" y="742" text-anchor="middle">Drawn from factory/feature/SKILL.md, which a drift test keeps in line with the code.</text>
</svg>
